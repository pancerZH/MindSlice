# MindSlice retrieval evaluation queries.
#
# split:     dev (may inform engine changes) | holdout (read once per frozen engine) | limits (known lexical limits, no line)
# category:  what the query exercises (see PLAN.md)
# relevant:  graded judgments on the address search() returns (after supersession redirects).
#            2 = answers the query, 1 = related or partially useful. Unlisted results count as 0.
#            A superseded card is never listed: the engine returns its replacement instead.

